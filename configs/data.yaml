# Ρυθμίσεις δεδομένων ESCI. Τα paths είναι σχετικά με τη ρίζα του repo.
esci:
  raw_dir: data/esci_data/esci-data/shopping_queries_dataset
  examples_file: shopping_queries_dataset_examples.parquet
  products_file: shopping_queries_dataset_products.parquet
  sources_file: shopping_queries_dataset_sources.csv

filters:
  version: small_version   # small_version | large_version
  locale: us               # us | es | jp

split:
  val_fraction: 0.1        # ποσοστό των train queries που γίνονται val (ανά query_id)
  seed: 42

output_dir: data/processed/esci_small_us

# Amazon Reviews 2023 (McAuley Lab) — metadata ανά κατηγορία, για υποσύνολα του ESCI ανά κατηγορία.
# Κάθε κατηγορία κατεβαίνει στο <out_dir>/meta_<Category>_slim.parquet (src/meta.py).
amazon_meta:
  base_url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/meta_categories/
  categories: [Electronics]   # ονόματα όπως στο Amazon 2023, π.χ. Cell_Phones_and_Accessories
  out_dir: data/amazon_reviews
  columns: [parent_asin, title, main_category, categories, store, price, average_rating, rating_number]
