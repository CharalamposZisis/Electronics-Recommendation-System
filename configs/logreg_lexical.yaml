# Logistic Regression σε lexical features (query, title, κοινοί όροι, BM25, overlap) — src/classifiers.py.
# Το C επιλέγεται με macro-F1 στο val.
name: logreg_lexical
method: logreg
data_dir: data/processed/esci_small_us
eval_splits: [val, test]
seed: 42
features:
  min_df: 2
  bm25: {k1: 1.2, b: 0.75}
model:
  C_grid: [0.3, 1.0, 3.0]
  max_iter: 1000
  class_weight: null
